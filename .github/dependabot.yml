# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
version: 2

registries:
  c8y-public: # Define access for a private registry
    type: "maven-repository"
    url: "https://nexus.dev.c8y.io/repository/public"
    username: "${{secrets.C8Y_MVN_PUBLIC_USERNAME}}"
    password: "${{secrets.C8Y_MVN_PUBLIC_PASSWORD}}"

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "00:00"
      timezone: "Europe/Berlin"

  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "daily"
      time: "00:00"
      timezone: "Europe/Berlin"
    registries:
      - "c8y-public"
    open-pull-requests-limit: 20
    ignore:
      - dependency-name: "org.apache.pulsar:*"
        versions: [ ">=3.0.0" ]
      - dependency-name: "org.cometd.java:*" # Frozen due to heavy modifications
      - dependency-name: "org.eclipse.jetty:*"
        versions: [ ">=12.1.0" ]
      - dependency-name: "org.springframework:*"
        versions: [ ">=7.0.0" ]
      - dependency-name: "org.springframework.boot:*"
        versions: [ ">=4.0.0" ]
      - dependency-name: "org.junit:*"
        versions: [ ">=6.0.0" ]
